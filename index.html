<style>
/* Layout: a 12-column Swiss grid like the deck; every view is a "slide" with a small metadata row on top, regular-weight Helvetica headlines, and numbered contents lists */
:root{
  --bg:#000000; --fg:#FFFFFF; --dim:#8A8A8A; --faint:#4A4A4A; --rule:#262626;
  --f:"Helvetica Neue", "HelveticaNeue", "Helvetica Neue LT Std", Helvetica, Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.slide{position:relative;z-index:1;max-width:1400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-block:20px 28px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px}

/* metadata row */
.meta{font-size:10px;line-height:1.35;color:var(--fg);align-items:start}
.meta .c1{grid-column:1/3;font-weight:700;letter-spacing:.01em}
.meta .c2{grid-column:3/5}
.meta .c3{grid-column:5/9}
.meta .c4{grid-column:9/12}
.meta .c5{grid-column:12/13;text-align:right;font-variant-numeric:tabular-nums}
.meta a:hover{color:var(--dim)}
.meta nav{display:flex;flex-direction:column}
.meta nav a[aria-current="page"]::before{content:"— "}

.body{flex:none;padding-top:clamp(64px,12vh,140px)}
.col-l{grid-column:3/5;font-size:10px;color:var(--fg);padding-top:6px}
.col-main{grid-column:5/13}

h1,h2{font-weight:400;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,4.2vw,58px);line-height:1.05}
h2{font-size:clamp(26px,2.6vw,36px);line-height:1.12}
.dash{display:block;width:16px;height:1px;background:var(--fg);margin:28px 0 10px}
.small{font-size:10px;line-height:1.5}

/* contents list */
.toc{list-style:none;margin:0;padding:0;font-size:clamp(16px,1.35vw,19px);line-height:1.3}
.toc li .rw{display:grid;grid-template-columns:2.2em minmax(0,1fr) 7em 3.5em;gap:12px;width:100%;padding:2px 0}
.toc li .rw:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.toc .n,.toc .y{font-variant-numeric:tabular-nums}
.toc .k{color:inherit}
.toc.archive{color:var(--faint);margin-top:40px}
.toc.archive li .rw:hover{color:var(--dim)}
.toc-label{font-size:10px;margin-bottom:12px}
.toc.archive + .x{display:none}

/* case */
.ctx{list-style:none;margin:0;padding:0;font-size:clamp(15px,1.25vw,18px);line-height:1.25}
.cover{grid-column:1/13;width:100%;max-width:100%;height:auto;display:block;margin-top:72px;background:#141414}
.cover.ph{aspect-ratio:16/9}
.ph{display:flex;align-items:flex-end;padding:14px;background:#141414;aspect-ratio:16/9}
.ph span{font-size:10px;color:var(--dim)}
.gallery{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px}
.gimg{width:100%;max-width:100%;height:auto;display:block;background:#141414}
.dec{list-style:none;margin:0;padding:0;font-size:clamp(15px,1.25vw,18px);line-height:1.35;max-width:760px}
.dec li{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.dec li span:first-child{font-variant-numeric:tabular-nums;color:var(--dim)}
.pdf{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.cols{margin-top:72px;row-gap:32px}
.cols section{min-width:0}
.cols h3{font-size:clamp(18px,1.5vw,22px);font-weight:400;margin:0 0 12px;line-height:1.15}
.cols p{margin:0;font-size:12px;line-height:1.5;max-width:36ch}
.cols .s1{grid-column:5/8}.cols .s2{grid-column:8/11}.cols .s3{grid-column:11/13}
.stats{margin-top:96px;text-align:center}
.stats .st{grid-column:span 2;min-width:0}
.stats .v{font-size:clamp(40px,4.4vw,64px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats .l{font-size:15px;font-weight:700;line-height:1.3;color:var(--dim);margin-top:8px}
.stats .dot{width:10px;height:10px;border-radius:50%;background:var(--fg);margin:22px auto 0}
.stats .st:first-child{grid-column:5/7}

.foot{margin-top:auto;padding-top:96px;font-size:10px;align-items:end}
.foot .c1{grid-column:1/3}
.foot .c3{grid-column:5/9;display:flex;gap:28px}
.foot .c5{grid-column:9/13;text-align:right;color:var(--dim)}
.foot button:hover{color:var(--dim)}

/* about / contact */
.facts{list-style:none;margin:0;padding:0;font-size:clamp(15px,1.25vw,18px);line-height:1.3}
.facts li{display:grid;grid-template-columns:8em minmax(0,1fr);gap:12px}
.facts li span:first-child{font-variant-numeric:tabular-nums}
.prose{font-size:12px;line-height:1.55;max-width:38ch;margin:0}
.mail{font-size:clamp(26px,3.4vw,48px);letter-spacing:-.015em;user-select:all;word-break:break-all}
.facts.links li{display:block}
.facts.links a:hover{color:var(--dim)}
.em{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;min-width:0}
.em #email{word-break:break-all}
.copy{color:var(--dim)}
.copy:hover{color:var(--fg)}

/* left-column navigation, pinned while scrolling */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);height:0;z-index:3}
.side .in{grid-column:1/3;display:flex;flex-direction:column;gap:18px}
.side .nm{font-size:10px;font-weight:700;line-height:1.35}
.side nav{display:flex;flex-direction:column;gap:4px;font-size:16px;line-height:1.25}
.side nav a{color:var(--dim)}
.side nav a[aria-current="page"]{color:var(--fg)}
.side nav a[aria-current="page"]::before{content:"\2014\00a0"}
.side nav a:hover{color:var(--fg)}
/* rotating headline */
#rotator .fixed{display:block;color:var(--dim)}
#rotator .hls{display:grid;max-width:15em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hl{grid-area:1/1;opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.hl.on{opacity:1;transform:none;transition-delay:.2s}
.hl.out{opacity:0;transform:translateY(-14px);transition-delay:0s}
.side .who{display:flex;align-items:center;gap:2px}
.dl{display:inline-block;width:.75em;height:.75em;margin-left:.3em;vertical-align:-.02em}
.back{display:none}
/* viewed projects */
.toc li .rw.seen .t{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--fg)}
.toc li .rw.seen:hover .t{text-decoration:line-through;text-decoration-color:var(--fg)}
/* motion */
.live{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--fg);margin-right:6px;vertical-align:1px}
.foot a,.foot button{background:linear-gradient(var(--fg),var(--fg)) 0 100%/0 1px no-repeat;transition:background-size .35s ease}
.foot a:hover,.foot button:hover{color:var(--fg);background-size:100% 1px}
.toc li .rw{transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .3s ease,color .3s ease}
.toc:hover li .rw{opacity:.4}
.toc li .rw:hover{opacity:1;transform:translateX(10px);color:var(--fg)}
.toc.archive li .rw:hover{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){
  #app>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  #app>*:nth-child(2){animation-delay:.08s}#app>*:nth-child(3){animation-delay:.16s}#app>*:nth-child(4){animation-delay:.24s}#app>*:nth-child(5){animation-delay:.32s}#app>*:nth-child(6){animation-delay:.4s}#app>*:nth-child(7){animation-delay:.48s}#app>*:nth-child(8){animation-delay:.56s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .live{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .stats .dot{animation:beat 3.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.55}}
}

  .side{position:sticky;top:0;height:auto;z-index:5;margin:-20px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 12px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));

  .meta,.col-l,.small,.toc-label,.foot,.cover span{font-size:11px}

}
.side nav a,.side .nm{white-space:nowrap}
@media (max-width:380px){.side nav{gap:10px;font-size:13px}}
@media (max-width:340px){.side nav{gap:8px;font-size:12px}.side .back{width:36px;margin-left:-10px}}

/* hover: breathing opacity, after andrewchee.com */
.meta a:hover,.facts.links a:hover,.foot a:hover,.foot button:hover{color:inherit}
.foot a,.foot button{background:none!important}

a:hover,button:hover{cursor:progress!important}
@media (prefers-reduced-motion:no-preference){a:hover,a:focus-visible,button:hover,button:focus-visible{animation:breath 1.5s ease-in-out infinite!important}}

/* Embedded prototype (DesignOS). An exception to the no-color rule: it is product content in a frame, like an image. See DESIGN.md. */
.proto-wrap{grid-column:3/13;margin-top:72px;min-width:0}
.proto{--pass:#46C98B;--sky:#9CCBE6;--warn:#E0B44F;--mono:ui-monospace,"SF Mono",Menlo,monospace;background:#0A0A0A;border:1px solid var(--rule);font-size:12px;line-height:1.4;color:var(--fg)}

.pt-bar>span:nth-child(2){flex:1;text-align:center}
.pt-dots{display:flex;gap:6px}.pt-dots i{width:8px;height:8px;border-radius:50%;background:#2a2a2a}

/* Background: drifting dots joined by hairlines, like the deck's node drawings */
(function(){
  const c = document.getElementById("bg"), x = c.getContext("2d");
  if (!x) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LINK = 150, PUSH = 130;
  const SPARK = ['143,168,255','127,224,212','255,184,107','229,156,255','255,143,163'];
  let W = 0, H = 0, pts = [], raf = 0, mouse = { x: -9999, y: -9999 };
  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.max(28, Math.min(90, W * H / 15000)));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28,
      r: Math.random() < .12 ? 2.4 : 1.1
    }));
  }
  function draw(){
    x.clearRect(0, 0, W, H);
    if (!reduce) for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < PUSH && d > 0) { const f = (1 - d / PUSH) * 1.4; p.x += dx / d * f; p.y += dy / d * f; }
    }
    x.lineWidth = .5;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < LINK) {
        x.strokeStyle = `rgba(255,255,255,${((1 - d / LINK) * .2).toFixed(3)})`;
        x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
      }
    }
    for (const p of pts) {
      x.fillStyle = p.r > 2 ? "rgba(255,255,255,.7)" : "rgba(255,255,255,.4)";
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, Math.PI * 2); x.fill();
    }
    for (const p of pts) {
      if (!p.t && !reduce && Math.random() < .0003) { p.t = 1; p.c = SPARK[Math.floor(Math.random() * SPARK.length)]; }
      if (p.t) {
        var e = Math.sin(Math.PI * (1 - p.t)), g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, 14);
        g.addColorStop(0, 'rgba(' + p.c + ',' + (.55 * e).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + p.c + ',0)');
        x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, 14, 0, Math.PI * 2); x.fill();
        x.fillStyle = 'rgba(' + p.c + ',' + (.9 * e).toFixed(3) + ')'; x.beginPath(); x.arc(p.x, p.y, p.r + .6, 0, Math.PI * 2); x.fill();
        p.t = Math.max(0, p.t - 1 / 110);
      }
    }

  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); if (reduce) draw(); }, 150); });
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  document.addEventListener("visibilitychange", () => {
    if (reduce) return;
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(draw);
  });
  size(); draw();
})();
